name: Daily Notion Activity Sync

on:
  schedule:
    # 11:00 PM IST = 17:30 UTC
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Sync approved Notion tasks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: df67ff53-c724-410e-bced-b3627f1cbf0c
        run: python scripts/sync_notion.py

      - name: Commit daily activity
        id: publish
        env:
          GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
        run: |
          test -n "$GIT_COMMIT_EMAIL"
          git config user.name "MaybeSomeone-arc18"
          git config user.email "$GIT_COMMIT_EMAIL"
          git add .
          if git diff --cached --quiet; then
            echo "No approved activity to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily activity $(date -u +%Y-%m-%d)"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark published tasks in Notion
        if: steps.publish.outputs.published == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: df67ff53-c724-410e-bced-b3627f1cbf0c
        run: python scripts/mark_published.py
